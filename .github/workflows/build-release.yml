name: Build and Release

on:
  push:
    branches:
      - dev
    paths:
      - 'package.json'
  # Manual fallback: lets a release be built when the push/paths trigger
  # misses (e.g. a merge commit GitHub doesn't path-match). Builds whatever
  # version is currently in package.json on the chosen ref. Only a run on
  # `dev` publishes; any other ref is a dry run (build + artifacts, no release).
  workflow_dispatch:

permissions:
  contents: read

# Two quick version bumps must not race each other into the same release.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-changed: ${{ steps.version.outputs.changed }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=v${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          
          git diff HEAD^ HEAD -- package.json > package_diff.txt
          
          if grep -q '"version"' package_diff.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed to ${CURRENT_VERSION}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

      - name: Decide whether to publish
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WILL_BUILD: ${{ steps.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Not on dev: dry run, nothing will be published"
            exit 0
          fi
          echo "publish=true" >> $GITHUB_OUTPUT

          # Never re-release an existing tag.
          if [ "$WILL_BUILD" = "true" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Tag ${VERSION} already exists. Bump the version in package.json."
            exit 1
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check-version, test]
    if: needs.check-version.outputs.version-changed == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-build
            electron_args: --win --x64
          - os: ubuntu-latest
            label: Linux x64
            artifact: linux-build
            electron_args: --linux --x64
          # One job per macOS architecture: each bundles the ffmpeg/ffprobe
          # binaries of its own architecture and writes its own latest-mac.yml
          # (merged in the release job). The Intel build runs on the Apple
          # Silicon runner; electron-builder fetches the x64 Electron.
          - os: macos-latest
            label: macOS Intel (x64)
            artifact: macos-x64-build
            electron_args: --mac --x64
            mac_arch: x64
          - os: macos-latest
            label: macOS Apple Silicon (arm64)
            artifact: macos-arm64-build
            electron_args: --mac --arm64
            mac_arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Clean install dependencies
        shell: bash
        run: npm ci
        env:
          CI: true

      - name: Build application
        run: npm run build

      # @ffmpeg-installer and @ffprobe-installer ship one optional package per
      # platform and npm installs only the runner's (arm64). Swap in the x64
      # ones, at the versions the lockfile records, for the Intel build.
      - name: Install x64 ffmpeg and ffprobe (macOS Intel)
        if: matrix.mac_arch == 'x64'
        run: |
          set -euo pipefail
          lock_version() {
            node -p "require('./package-lock.json').packages['node_modules/$1'].version"
          }
          npm install --no-save --force --ignore-scripts \
            "@ffmpeg-installer/darwin-x64@$(lock_version @ffmpeg-installer/darwin-x64)" \
            "@ffprobe-installer/darwin-x64@$(lock_version @ffprobe-installer/darwin-x64)"
          rm -rf node_modules/@ffmpeg-installer/darwin-arm64 node_modules/@ffprobe-installer/darwin-arm64

      - name: Build Electron app
        run: npm run electron:build -- ${{ matrix.electron_args }} --publish never
        env:
          CI: true

      - name: Check bundled ffmpeg and ffprobe (macOS)
        if: matrix.mac_arch
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          set -euo pipefail
          [ "$MAC_ARCH" = "x64" ] && CPU=x86_64 || CPU=arm64
          MODULES=$(echo dist-electron/mac*/*.app)/Contents/Resources/app.asar.unpacked/node_modules
          for tool in ffmpeg ffprobe; do
            BIN="$MODULES/@${tool}-installer/darwin-${MAC_ARCH}/${tool}"
            file "$BIN"
            file "$BIN" | grep -q "$CPU" || { echo "::error::$tool for $CPU is not bundled"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.dmg
            dist-electron/*.dmg.blockmap
            dist-electron/*.zip
            dist-electron/*.zip.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 5

  # Merges the two macOS manifests and recomputes every checksum from the
  # files that get published. Runs on dry runs too; `release` only publishes.
  manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: ./artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-build
          path: ./artifacts

      # Per-architecture directories, so the two latest-mac.yml files do not
      # overwrite each other before they are merged.
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-x64-build
          path: ./artifacts-mac-x64

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64-build
          path: ./artifacts-mac-arm64

      - name: Merge macOS manifests and refresh checksums
        run: node scripts/update-manifests.js artifacts artifacts-mac-x64 artifacts-mac-arm64

      - name: List release files
        run: |
          ls -l ./artifacts
          for f in latest.yml latest-linux.yml latest-mac.yml; do
            echo "--- $f"
            cat "./artifacts/$f"
          done

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: artifacts/*
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [check-version, manifests]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          
          # Everything since the previous version bump. Tags are not used:
          # v1.7.0 to v1.8.1 were created on the default branch, not on the
          # commits that were built, so they are not ancestors of dev.
          PREVIOUS_BUMP=$(git log -2 --format=%H -G'"version": "' -- package.json | sed -n 2p)
          
          if [ -z "$PREVIOUS_BUMP" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREVIOUS_BUMP}..HEAD"
          fi
          
          # Generate changelog
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Commits in that range, without housekeeping commits
          git log ${COMMIT_RANGE} --pretty=format:"- %s (%an)" --no-merges \
            | grep -Ev '^- (chore|ci|docs|test|build)(\([^)]*\))?!?:' >> CHANGELOG.md || true
          
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Statistics" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- **Commits**: $(git rev-list --count --no-merges ${COMMIT_RANGE})" >> CHANGELOG.md
          echo "- **Contributors**: $(git log ${COMMIT_RANGE} --format='%an' --no-merges | sort -u | wc -l)" >> CHANGELOG.md
          
          # Add language support info
          LANG_COUNT=$(find locales -name "*.json" -type f | wc -l)
          echo "- **Supported Languages**: ${LANG_COUNT}" >> CHANGELOG.md
          
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CueBard ${{ needs.check-version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        run: |
          echo "Release ${{ needs.check-version.outputs.version }} published successfully!"
          echo "Download at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.version }}"
