name: CI

on:
  pull_request:
    branches:
      - dev
  # Reused by build-release.yml so a release is never built from a red tree.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tests/remote-viewer.test.ts imports `electron`; without this the first
      # vitest run can race the binary download and fail to load the suite.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      # tsconfig.json extends .nuxt/tsconfig.json, which postinstall does not
      # generate. `npm run typecheck` runs `nuxt prepare` first.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
