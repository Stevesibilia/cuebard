<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CueBard welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161616}
a{color:#78A9FF}a:hover{color:#A6C8FF}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; align-items: center; justify-content: center; background: #161616; color: #F4F4F4; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<symbol id="quill" viewBox="0 0 120 120">
<g transform="rotate(-40 60 60)">
<rect x="16" y="58" width="90" height="4" rx="2" fill="currentColor"></rect>
<path d="M6 60 L18 54 L18 66 Z" fill="currentColor"></path>
<rect x="30" y="55" width="6" height="10" rx="3" fill="currentColor"></rect>
<rect x="39" y="49" width="6" height="22" rx="3" fill="currentColor"></rect>
<rect x="48" y="43" width="6" height="34" rx="3" fill="currentColor"></rect>
<rect x="57" y="38" width="6" height="44" rx="3" fill="currentColor"></rect>
<rect x="66" y="36" width="6" height="48" rx="3" fill="currentColor"></rect>
<rect x="75" y="39" width="6" height="42" rx="3" fill="currentColor"></rect>
<rect x="84" y="45" width="6" height="30" rx="3" fill="currentColor"></rect>
<rect x="93" y="52" width="6" height="16" rx="3" fill="currentColor"></rect>
</g>
</symbol>
</defs>
</svg>
<div style="width: 100%; max-width: 880px; box-sizing: border-box; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 18px">
<div style="width: 88px; height: 88px; border-radius: 22px; background: #222222; display: flex; align-items: center; justify-content: center; color: {{accent}}">
<svg width="64" height="64" aria-hidden="true"><use href="#quill"></use></svg>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; line-height: 1">CueBard</h1>
<p style="margin: 0; max-width: 320px; font-size: 16px; line-height: 1.5; color: #C6C6C6">Audio and visual cues for tabletop sessions and live events.</p>
<div style="display: flex; gap: 10px; margin-top: 8px">
<button style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-weight: 600">New project</button>
<button style="height: 44px; padding: 0 18px; border: 1px solid #393939; border-radius: 10px; background: transparent">Open project</button>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8D8D8D">v2.1.0 · based on LivePlay</span>
</div>
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #C6C6C6; margin-bottom: 6px">RECENT</span>
<sc-for list="{{recent}}" as="p" hint-placeholder-count="4">
<button style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 1px solid #2E2E2E; border-radius: 10px; background: #1C1C1C; text-align: left">
<span style="width: 32px; height: 32px; flex: none; border-radius: 8px; background: #262626; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C6C6C6" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 500">{{p.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8D8D8D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.path}}</span>
</span>
<span style="font-size: 12px; color: #8D8D8D">{{p.when}}</span>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4589FF","options":["#4589FF","#4FB3BF","#DA1E28"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#4589FF',
recent: [
{ name: 'Session 12 · The Citadel', path: '~/Games/Citadel/Session 12.cuebard', when: 'Today' },
{ name: 'Session 11', path: '~/Games/Citadel/Session 11.cuebard', when: 'Last week' },
{ name: 'One-shot · Harbour', path: '~/Games/Oneshots/harbour.liveplay', when: 'September' },
{ name: '[YOUR PROJECT]', path: '[path]', when: '' },
],
};
}
}
</script>
</body>
</html>
